<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me</title>

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Glow -->
  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <!-- Theme Toggle -->
  <div class="theme-switch">
    <i class="fa-solid fa-sun"></i>

    <label class="switch">
      <input type="checkbox" id="themeToggle">
      <span class="slider"></span>
    </label>

    <i class="fa-solid fa-moon"></i>
  </div>

  <!-- Main Container -->
  <div class="container">

    <div class="card">
      <h1>Contact Me</h1>
      <p class="subtitle">
        Let's build something futuristic together.
      </p>

      <!-- Contact Links -->
      <div class="contact-links">

        <a href="mailto:yourmail@example.com" class="contact-btn">
          <i class="fa-solid fa-envelope"></i>
          Email
        </a>

        <a href="https://t.me/yourusername" target="_blank" class="contact-btn">
          <i class="fa-brands fa-telegram"></i>
          Telegram
        </a>

        <a href="https://wa.me/94770000000" target="_blank" class="contact-btn">
          <i class="fa-brands fa-whatsapp"></i>
          WhatsApp
        </a>

      </div>

      <!-- Social Media -->
      <div class="social-section">
        <h2>Social Media</h2>

        <div class="social-icons">

          <a href="#" target="_blank">
            <i class="fa-brands fa-facebook-f"></i>
          </a>

          <a href="#" target="_blank">
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a href="#" target="_blank">
            <i class="fa-brands fa-x-twitter"></i>
          </a>

          <a href="#" target="_blank">
            <i class="fa-brands fa-github"></i>
          </a>

          <a href="#" target="_blank">
            <i class="fa-brands fa-discord"></i>
          </a>

        </div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
